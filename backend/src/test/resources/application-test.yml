# Perfil de teste: o DataSource vem do Testcontainers (@ServiceConnection);
# uploads vão para target/ (limpo pelo mvn clean) e o log fica mais quieto.
application:
  storage:
    upload-dir: target/test-uploads

logging:
  level:
    com.print3dmanager.erp: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
