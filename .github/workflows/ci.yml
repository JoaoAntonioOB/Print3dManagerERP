name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw esta versionado sem bit de execucao (repo desenvolvido no Windows).
      - run: chmod +x mvnw

      - name: Rodar testes (unitarios + integracao via Testcontainers)
        run: ./mvnw -B test

  backend-dependency-check:
    name: Backend - OWASP dependency-check (CVEs Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw esta versionado sem bit de execucao (repo desenvolvido no Windows).
      - run: chmod +x mvnw

      # Cache do banco de dados NVD sincronizado pelo dependency-check: sem
      # isso a primeira sincronizacao pode levar dezenas de minutos (ou falhar
      # por rate limit sem NVD_API_KEY). Chave unica por execucao + restore-keys
      # por prefixo garante que sempre puxamos o cache incremental mais recente.
      - name: Cache da base NVD
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dep-check-nvd-${{ github.run_id }}
          restore-keys: |
            owasp-dep-check-nvd-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ARGS="-DfailBuildOnCVSS=7 -Dformats=HTML,JSON"
          if [ -n "$NVD_API_KEY" ]; then
            ARGS="$ARGS -DnvdApiKey=$NVD_API_KEY"
          fi
          ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check $ARGS

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore

  frontend:
    name: Frontend - lint, build & npm audit (CVEs npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: npm audit (CVEs de alta severidade)
        run: npm audit --audit-level=high
