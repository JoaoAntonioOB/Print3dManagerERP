server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de STL/3MF podem ser grandes
    client_max_body_size 120M;

    # Compressão para assets do frontend
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy: camada extra de defesa contra XSS (o JWT
    # fica em localStorage - decisão consciente já aceita na auditoria,
    # não revertida aqui). 'unsafe-inline' em style-src é necessário porque
    # o MUI/emotion injeta <style> em runtime; script-src fica sem
    # 'unsafe-inline'/'unsafe-eval' pois o build do Vite só referencia JS
    # externo com hash (nenhum <script> inline no dist/index.html).
    # connect-src 'self' cobre as chamadas Axios via proxy /api same-origin.
    # Validado em browser real (login, dashboard, navegação pelos módulos)
    # sem nenhuma violação de CSP no console do DevTools.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy da API para o backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Assets com hash no nome podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
